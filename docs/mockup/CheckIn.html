<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evening check-in · Daily Log mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E40AF}
button{font:inherit;color:inherit;cursor:pointer}
.chip{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 12px;border-radius:12px;border:1px solid #DDE1E7;background:#fff;font-size:14px;font-weight:600;color:#16181D}
.chip-on{background:#16181D;border-color:#16181D;color:#fff}
.row{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid #EEF0F3}
.q{margin:0;font-size:15px;font-weight:700}
.step{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid #DDE1E7;background:#fff;padding:0;color:#16181D}
.glass{width:30px;height:36px;border:0;padding:0;border-radius:4px 4px 8px 8px;background:#E3E6EB}
.glass-on{background:#2F5BD3}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F6F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16181D">
  <header style="display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 12px 12px 20px">
    <div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Evening check-in</h1>
      <p style="margin: 2px 0 0; font-size: 13px; color: #5B6270">About 30 seconds · fills the gaps in your day</p>
    </div>
    <a href="Main.html" aria-label="Close" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; color: #3D4350">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
  </header>

  <div style="margin: 0 16px; background: #fff; border: 1px solid #E3E6EB; border-radius: 20px; overflow: hidden">
    <div class="row">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 class="q">Sleep last night</h2>
        <div style="display: flex; align-items: center; gap: 10px">
          <button class="step" aria-label="Less sleep"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <span style="font-size: 16px; font-weight: 700; min-width: 64px; text-align: center">6 h 20</span>
          <button class="step" aria-label="More sleep"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="chip chip-on">Poor</button>
        <button class="chip">OK</button>
        <button class="chip">Good</button>
      </div>
    </div>

    <div class="row">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 class="q">Water</h2>
        <span style="font-size: 14px; font-weight: 700; color: #1F45B0">5 glasses</span>
      </div>
      <div style="display: flex; justify-content: space-between">
        <button class="glass glass-on" aria-label="1 glass"></button>
        <button class="glass glass-on" aria-label="2 glasses"></button>
        <button class="glass glass-on" aria-label="3 glasses"></button>
        <button class="glass glass-on" aria-label="4 glasses"></button>
        <button class="glass glass-on" aria-label="5 glasses"></button>
        <button class="glass" aria-label="6 glasses"></button>
        <button class="glass" aria-label="7 glasses"></button>
        <button class="glass" aria-label="8 glasses"></button>
      </div>
    </div>

    <div class="row">
      <h2 class="q">Stress today</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="chip">Low</button>
        <button class="chip">Medium</button>
        <button class="chip chip-on">High</button>
      </div>
    </div>

    <div class="row">
      <h2 class="q">Screen time</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="chip">Under 4 h</button>
        <button class="chip">4 – 8 h</button>
        <button class="chip chip-on">8 h +</button>
      </div>
    </div>

    <div class="row">
      <h2 class="q">Moved your body?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="chip chip-on">No</button>
        <button class="chip">A walk</button>
        <button class="chip">Workout</button>
      </div>
    </div>

    <div class="row" style="border-bottom: 0">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 class="q">Any heartburn today?</h2>
        <div style="display: flex; gap: 8px">
          <button class="chip" style="width: 64px">Yes</button>
          <button class="chip chip-on" style="width: 64px">No</button>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #F5F6F8; border-top: 1px solid #E3E6EB">
    <a href="Main.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #2F5BD3; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none">Done for today</a>
  </div>
</div>
</body>
</html>
