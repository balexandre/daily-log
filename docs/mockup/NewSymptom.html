<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a new symptom · Daily Log mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E40AF}
button{font:inherit;color:inherit;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid #DDE1E7;background:#fff;font-size:14px;font-weight:600;color:#16181D}
.chip-on{background:#16181D;border-color:#16181D;color:#fff}
.chip-new{border:1.5px dashed #C9CED6;color:#3D4350;background:transparent}
.label{margin:0;font-size:12px;font-weight:700;color:#5B6270;letter-spacing:.06em;text-transform:uppercase}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;border:1px solid #DDE1E7;background:#fff;text-align:left}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F6F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16181D">
  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 20px 8px 8px">
    <a href="LogSymptom.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; color: #3D4350">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">New symptom</h1>
  </header>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 22px">
    <section style="display: flex; flex-direction: column; gap: 8px">
      <label for="name" class="label">Name</label>
      <input id="name" value="Heartburn" style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #2F5BD3; background: #fff; padding: 0 14px; font: inherit; font-size: 17px; font-weight: 600">
      <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
        <span style="font-size: 12px; color: #5B6270">Suggestions:</span>
        <button class="chip" style="height: 32px; font-size: 13px; padding: 0 10px">Dizziness</button>
        <button class="chip" style="height: 32px; font-size: 13px; padding: 0 10px">Diarrhoea</button>
        <button class="chip" style="height: 32px; font-size: 13px; padding: 0 10px">Joint pain</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 class="label">How do you want to rate it?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="opt" style="border: 2px solid #16181D">
          <span style="font-size: 14px; font-weight: 700">1 – 10</span>
          <span style="font-size: 12px; color: #5B6270">How bad</span>
        </button>
        <button class="opt">
          <span style="font-size: 14px; font-weight: 700">Yes / no</span>
          <span style="font-size: 12px; color: #5B6270">Just happened</span>
        </button>
        <button class="opt">
          <span style="font-size: 14px; font-weight: 700">Duration</span>
          <span style="font-size: 12px; color: #5B6270">Start → end</span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 class="label">Where can it happen? <span style="text-transform: none; letter-spacing: 0; font-weight: 500">(optional)</span></h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span class="chip">Chest
          <button aria-label="Remove Chest" style="border: 0; background: none; padding: 0; display: flex; color: #5B6270"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </span>
        <span class="chip">Throat
          <button aria-label="Remove Throat" style="border: 0; background: none; padding: 0; display: flex; color: #5B6270"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </span>
        <button class="chip chip-new">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Add place
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; background: #fff; border: 1px solid #E3E6EB; border-radius: 16px">
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEF0F3">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Show on Today screen</span>
          <span style="font-size: 12px; color: #5B6270">As a one-tap button</span>
        </span>
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2F5BD3">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Ask about it in check-in</span>
          <span style="font-size: 12px; color: #5B6270">"Any heartburn today?"</span>
        </span>
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #2F5BD3">
      </label>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #F5F6F8; border-top: 1px solid #E3E6EB">
    <a href="LogSymptom.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #2F5BD3; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none">Add symptom</a>
  </div>
</div>
</body>
</html>
