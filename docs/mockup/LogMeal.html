<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log a meal · Daily Log mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E40AF}
button{font:inherit;color:inherit;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid #DDE1E7;background:#fff;font-size:14px;font-weight:600;color:#16181D}
.chip-on{background:#16181D;border-color:#16181D;color:#fff}
.chip-new{border:1.5px dashed #C9CED6;color:#3D4350;background:transparent}
.label{margin:0;font-size:12px;font-weight:700;color:#5B6270;letter-spacing:.06em;text-transform:uppercase}
.seg{height:40px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:#3D4350;padding:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F6F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16181D">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px 20px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Log a meal</h1>
    <a href="Main.html" aria-label="Close" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; color: #3D4350">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
  </header>

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 20px">
    <div role="group" aria-label="Meal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E9ECF0">
      <button class="seg">Breakfast</button>
      <button class="seg" style="background: #fff; color: #16181D; box-shadow: 0 1px 2px rgba(0,0,0,.08)">Lunch</button>
      <button class="seg">Dinner</button>
      <button class="seg">Snack</button>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <label for="food" class="label">What did you eat?</label>
      <input id="food" value="Pasta carbonara" style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #2F5BD3; background: #fff; padding: 0 14px; font: inherit; font-size: 17px; font-weight: 600">
      <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
        <span style="font-size: 12px; color: #5B6270">Recent:</span>
        <button class="chip" style="height: 32px; font-size: 13px; padding: 0 10px">Toast &amp; yogurt</button>
        <button class="chip" style="height: 32px; font-size: 13px; padding: 0 10px">Chicken salad</button>
        <button class="chip" style="height: 32px; font-size: 13px; padding: 0 10px">Pizza</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 class="label">Contains</h2>
        <span style="font-size: 12px; color: #5B6270">Auto-filled from name</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button class="chip chip-on">Dairy</button>
        <button class="chip chip-on">Gluten</button>
        <button class="chip chip-on">Fatty / fried</button>
        <button class="chip">Spicy</button>
        <button class="chip">Sugar</button>
        <button class="chip">Caffeine</button>
        <button class="chip">Alcohol</button>
        <button class="chip">Processed meat</button>
        <button class="chip">Beans / onion</button>
        <button class="chip chip-new">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Tag
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 class="label">How much?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="chip" style="justify-content: center">Light</button>
        <button class="chip" style="justify-content: center">Normal</button>
        <button class="chip chip-on" style="justify-content: center">Big</button>
      </div>
    </section>

    <section style="display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #E3E6EB; border-radius: 14px; padding: 12px 16px">
      <span style="font-size: 15px; font-weight: 600">When</span>
      <button style="border: 0; background: #EEF0F3; border-radius: 10px; height: 36px; padding: 0 12px; font-size: 14px; font-weight: 700">Today · 12:40</button>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #F5F6F8; border-top: 1px solid #E3E6EB">
    <a href="Main.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #2F5BD3; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none">Save lunch</a>
  </div>
</div>
</body>
</html>
